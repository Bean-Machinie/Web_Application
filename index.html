<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/logo/Black/HELIOSYN_Icon_Black.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/src/assets/logo/White/HELIOSYN_Icon_White.png" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Application</title>
    <!-- Sets the theme before the first paint, so there is no flash. Keep in step with ThemeProvider. -->
    <script>
      try {
        var theme = localStorage.getItem("theme")
        var dark =
          theme === "light"
            ? false
            : theme === "system"
              ? matchMedia("(prefers-color-scheme: dark)").matches
              : true
        document.documentElement.classList.toggle("dark", dark)
        document.documentElement.style.colorScheme = dark ? "dark" : "light"
      } catch (error) {
        document.documentElement.classList.add("dark")
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
